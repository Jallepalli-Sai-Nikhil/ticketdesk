name: TicketDesk CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Set up JDK 25.0.1
    - name: Set up JDK 25.0.1
      uses: actions/setup-java@v5
      with:
        java-version: '25.0.1'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Set up Node.js 26.2.0
    - name: Set up Node.js 26.2.0
      uses: actions/setup-node@v4
      with:
        node-version: '26.2.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # 4. Lint & Run unit tests
    - name: Run Backend Tests
      run: mvn -f backend/pom.xml clean test

    - name: Install Frontend Dependencies & Lint
      run: |
        if [ ! -f frontend/package-lock.json ]; then
          npm install --prefix frontend --package-lock-only
        fi
        npm ci --prefix frontend
        npm run lint --prefix frontend
        npm run build --prefix frontend

    # 5. Scan for committed secrets
    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        base: ""
        head: ${{ github.sha }}
        extra_args: --only-verified

    # 6. Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ap-south-1

    # 7. Log in to Amazon ECR
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 8. Build Docker image with tag based on git commit SHA & push to ECR
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ticketdesk-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f backend/Dockerfile backend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # 9. Update ECS service with the new image
    - name: Download active task definition
      run: |
        aws ecs describe-task-definition --task-definition ticketdesk-m1-backend-task --query taskDefinition --region ap-south-1 > task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: render-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ticketdesk-backend
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render-task-def.outputs.task-definition }}
        service: ticketdesk-m1-service
        cluster: ticketdesk-m1-cluster
        wait-for-service-stability: true

    # 10. Run live smoke tests against the deployed URL
    - name: Retrieve Deployed ALB URL & Run Smoke Tests
      run: |
        echo "Retrieving ALB DNS Name..."
        ALB_DNS=$(aws elbv2 describe-load-balancers --names ticketdesk-m1-alb --query "LoadBalancers[0].DNSName" --output text --region ap-south-1)
        DEPLOYED_URL="http://$ALB_DNS"
        echo "Deployed URL: $DEPLOYED_URL"
        
        echo "Waiting for service to be healthy at $DEPLOYED_URL/health..."
        ATTEMPTS=0
        MAX_ATTEMPTS=30
        HEALTHY=false
        
        while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
          RESPONSE=$(curl -s $DEPLOYED_URL/health || true)
          echo "Health status response: $RESPONSE"
          if [[ "$RESPONSE" == *'"status":"UP"'* ]]; then
            HEALTHY=true
            break
          fi
          ATTEMPTS=$((ATTEMPTS+1))
          sleep 5
        done
        
        if [ "$HEALTHY" = false ]; then
          echo "Error: Backend failed to respond with healthy status at $DEPLOYED_URL/health"
          exit 1
        fi
        
        echo "Backend is active. Testing API endpoints..."
        
        # Test 1: Create Ticket
        echo "Test 1: Creating a ticket..."
        CREATE_RES=$(curl -s -X POST -H "Content-Type: application/json" \
          -d '{"title":"CI Smoke Incident","description":"Generated automatically by CI pipeline","status":"OPEN","priority":"HIGH","category":"SOFTWARE"}' \
          $DEPLOYED_URL/api/tickets)
        echo "Create Ticket Response: $CREATE_RES"
        if [[ "$CREATE_RES" != *"CI Smoke Incident"* ]]; then
          echo "Error: Create Ticket endpoint failed!"
          exit 1
        fi
        
        # Test 2: Fetch Tickets
        echo "Test 2: Fetching tickets list..."
        FETCH_RES=$(curl -s $DEPLOYED_URL/api/tickets)
        echo "Fetch Tickets Response: $FETCH_RES"
        if [[ "$FETCH_RES" != *"CI Smoke Incident"* ]]; then
          echo "Error: Fetch Ticket endpoint failed!"
          exit 1
        fi
        
        # Test 3: Dashboard API
        echo "Test 3: Fetching dashboard stats..."
        DASH_RES=$(curl -s $DEPLOYED_URL/api/tickets/dashboard)
        echo "Dashboard Response: $DASH_RES"
        if [[ "$DASH_RES" != *'"total":'* ]]; then
          echo "Error: Dashboard API failed!"
          exit 1
        fi
        
        echo "Smoke tests completed successfully against deployed URL!"

    # 11. Pipeline Summary Report
    - name: Create Pipeline Summary
      if: always()
      run: |
        echo "## 🚀 TicketDesk CI Run Results" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| 📥 Code Checkout | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
        echo "| ☕ Java & Node Setup | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
        echo "| 🛠️ Lint & Unit Tests | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🛡️ Secret Scan | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🐳 Build & Push ECR | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🚀 Deploy to ECS | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏃 Live Smoke Tests | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
