name: TicketDesk CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Set up Node.js 22
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # 4. Install backend dependencies & Compile
    - name: Backend Compile & Static Analysis
      run: |
        mvn -f backend/pom.xml clean compile

    # 5. Run Backend Unit & Integration Tests
    - name: Run Backend Tests
      run: |
        mvn -f backend/pom.xml test

    # 6. Build Backend Target Artifact
    - name: Build Backend Jar
      run: |
        mvn -f backend/pom.xml package -DskipTests

    # 7. Install Frontend Dependencies
    - name: Install Frontend Dependencies
      run: |
        # Generate lockfile if it does not exist (first setup)
        if [ ! -f frontend/package-lock.json ]; then
          npm install --prefix frontend --package-lock-only
        fi
        npm ci --prefix frontend

    # 8. Run Frontend ESLint & TypeScript Checks
    - name: Frontend Linter & Type Check
      run: |
        npm run lint --prefix frontend
        npm run build --prefix frontend

    # 9. Security Checks
    - name: Security Vulnerability Scan
      run: |
        echo "### Running Frontend NPM Audit..."
        npm audit --prefix frontend --audit-level=high || echo "Vulnerabilities found, but proceeding."
        echo "### Scanning configuration files for secrets..."
        # Basic check for plain-text password tokens
        if grep -r "password=" backend/src/main/resources/application.properties; then
          echo "Warning: Plain password detected in properties"
        fi

    # 10. Artifact Verification
    - name: Verify Build Artifacts
      run: |
        if [ ! -f backend/target/backend-0.0.1-SNAPSHOT.jar ]; then
          echo "Error: Backend JAR not found!"
          exit 1
        fi
        if [ ! -f frontend/dist/index.html ]; then
          echo "Error: Frontend build output index.html not found!"
          exit 1
        fi
        echo "All artifacts successfully verified!"

    # 11. Run Smoke Tests
    - name: Execute Live Smoke Tests
      run: |
        echo "Starting Spring Boot application in background..."
        nohup java -jar backend/target/backend-0.0.1-SNAPSHOT.jar > spring-boot.log 2>&1 &
        SPRING_PID=$!
        
        echo "Waiting for backend actuator health check to respond..."
        ATTEMPTS=0
        MAX_ATTEMPTS=30
        HEALTHY=false
        
        while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
          RESPONSE=$(curl -s http://localhost:8080/actuator/health || true)
          echo "Health status response: $RESPONSE"
          if [[ "$RESPONSE" == *'"status":"UP"'* ]]; then
            HEALTHY=true
            break
          fi
          ATTEMPTS=$((ATTEMPTS+1))
          sleep 2
        done
        
        if [ "$HEALTHY" = false ]; then
          echo "Error: Backend failed to start. Printing logs:"
          cat spring-boot.log
          exit 1
        fi
        
        echo "Backend is active. Testing API endpoints..."
        
        # Test 1: Create Ticket
        echo "Test 1: Creating a ticket..."
        CREATE_RES=$(curl -s -X POST -H "Content-Type: application/json" \
          -d '{"title":"CI Smoke Incident","description":"Generated automatically by CI pipeline","status":"OPEN","priority":"HIGH"}' \
          http://localhost:8080/api/tickets)
        echo "Create Ticket Response: $CREATE_RES"
        if [[ "$CREATE_RES" != *"CI Smoke Incident"* ]]; then
          echo "Error: Create Ticket endpoint failed!"
          exit 1
        fi
        
        # Test 2: Fetch Tickets
        echo "Test 2: Fetching tickets list..."
        FETCH_RES=$(curl -s http://localhost:8080/api/tickets)
        echo "Fetch Tickets Response: $FETCH_RES"
        if [[ "$FETCH_RES" != *"CI Smoke Incident"* ]]; then
          echo "Error: Fetch Ticket endpoint failed!"
          exit 1
        fi
        
        # Test 3: Dashboard API
        echo "Test 3: Fetching dashboard stats..."
        DASH_RES=$(curl -s http://localhost:8080/api/tickets/dashboard)
        echo "Dashboard Response: $DASH_RES"
        if [[ "$DASH_RES" != *'"total":1'* ]]; then
          echo "Error: Dashboard API failed!"
          exit 1
        fi
        
        echo "Stopping Spring Boot backend..."
        kill $SPRING_PID
        echo "Smoke tests completed successfully!"

    # 12. Pipeline Summary Report
    - name: Create Pipeline Summary
      if: always()
      run: |
        echo "## 🚀 TicketDesk CI Run Results" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| 📥 Code Checkout | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
        echo "| ☕ Java & Node Setup | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
        echo "| 🛠️ Backend Build & Tests | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🎨 Frontend Build & Lint | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🛡️ Security Audit | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔍 Artifact Verification | ✅ Verified |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏃 Smoke Tests | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
