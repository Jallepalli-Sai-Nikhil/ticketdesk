<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus Control - Premium Ticket Management Dashboard for tracking issues, tasks, and requests." />
    <title>Nexus Control - Dashboard</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS CDN with Forms & Container Queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Tailwind Configuration matching Stitch UI theme -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-background": "#e5e2e1",
              "surface-container-high": "#2a2a2a",
              "primary-container": "#2563eb",
              "on-tertiary": "#472a00",
              "primary-fixed": "#dbe1ff",
              "primary": "#b4c5ff",
              "inverse-surface": "#e5e2e1",
              "secondary-container": "#00a572",
              "primary-fixed-dim": "#b4c5ff",
              "secondary-fixed": "#6ffbbe",
              "on-primary-fixed-variant": "#003ea8",
              "error": "#ffb4ab",
              "secondary": "#4edea3",
              "surface-container-lowest": "#0e0e0e",
              "on-secondary-fixed-variant": "#005236",
              "on-secondary-container": "#00311f",
              "tertiary-container": "#996100",
              "on-surface": "#e5e2e1",
              "surface-container-low": "#1c1b1b",
              "on-tertiary-fixed": "#2a1700",
              "on-tertiary-container": "#ffeedd",
              "surface-container": "#201f1f",
              "inverse-primary": "#0053db",
              "on-secondary-fixed": "#002113",
              "tertiary-fixed": "#ffddb8",
              "on-primary-fixed": "#00174b",
              "on-error-container": "#ffdad6",
              "on-primary-container": "#eeefff",
              "surface-bright": "#3a3939",
              "surface-container-highest": "#353534",
              "surface-variant": "#353534",
              "surface-dim": "#131313",
              "on-surface-variant": "#c3c6d7",
              "tertiary-fixed-dim": "#ffb95f",
              "surface": "#131313",
              "on-error": "#690005",
              "tertiary": "#ffb95f",
              "outline": "#8d90a0",
              "inverse-on-surface": "#313030",
              "outline-variant": "#434655",
              "background": "#131313",
              "surface-tint": "#b4c5ff",
              "on-tertiary-fixed-variant": "#653e00",
              "on-secondary": "#003824",
              "error-container": "#93000a",
              "secondary-fixed-dim": "#4edea3",
              "on-primary": "#002a78"

            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            spacing: {
              "container-padding": "32px",
              "sidebar-width": "260px",
              "sidebar-collapsed": "72px",
              "gutter": "24px",
              "card-gap": "20px",
              "base": "8px"
            },
            fontFamily: {
              "display-lg": ["Plus Jakarta Sans"],
              "body-md": ["Inter"],
              "body-sm": ["Inter"],
              "title-md": ["Plus Jakarta Sans"],
              "headline-lg": ["Plus Jakarta Sans"],
              "label-caps": ["JetBrains Mono"],
              "headline-lg-mobile": ["Plus Jakarta Sans"],
              "stat-lg": ["Plus Jakarta Sans"]
            },
            fontSize: {
              "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
              "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
              "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

              "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],

              "stat-lg": ["36px", { "lineHeight": "44px", "fontWeight": "700" }]

          }

      }

  <body>
    <div id="root"></div>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js" charset="utf-8"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
